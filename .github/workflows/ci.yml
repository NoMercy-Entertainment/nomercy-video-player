name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted for now: the beast-unit runners mount /var/lib/apt read-only,
    # so `playwright install --with-deps` fails before a test runs
    # (nomercy-github-runner#14). Back to self-hosted once that is fixed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: E2E tests
        run: yarn test:e2e

      - name: Build
        run: yarn build
